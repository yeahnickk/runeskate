<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>MineScape</title>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #000; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  body { position: fixed; inset: 0; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #gui { z-index: 2; image-rendering: pixelated; cursor: default; }
  #chat { position: fixed; left: 6px; right: 6px; bottom: 6px; height: 26px; z-index: 3; display: none; background: transparent; border: 0; outline: 0; color: #fff;
    font: 16px monospace; text-shadow: 2px 2px 0 #3f3f3f; padding: 0 6px; caret-color: #fff; }
  #name { position: fixed; z-index: 3; display: none; background: transparent; border: 0; outline: 0; color: #e0e0e0; font-family: monospace; padding: 0 6px; box-sizing: border-box; text-shadow: 2px 2px 0 #3f3f3f; }
</style>
