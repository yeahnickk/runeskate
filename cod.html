<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b2117">
<title>CODScape</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #ff981f; --panel: rgba(46,38,27,.94); --edge: #2b2117; --light: #7a6a4c; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
    background: linear-gradient(180deg, #3f6fb8 0%, #7fa6dc 40%, #b9cbe0 62%); font-family: monospace; color: #fff; }
  body { position: fixed; inset: 0; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #hud { pointer-events: none; image-rendering: pixelated; z-index: 2; }
  .panel { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 14px; z-index: 5;
    background: radial-gradient(ellipse at center, rgba(40,30,15,.55), rgba(0,0,0,.82)); text-align: center; padding: 16px; box-sizing: border-box; overflow-y: auto; }
  .box { background: var(--panel); border: 3px solid var(--edge); outline: 2px solid var(--light); outline-offset: -7px; padding: 22px 26px; max-width: 640px; width: 100%;
    box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; align-items: stretch; box-shadow: 6px 6px 0 rgba(0,0,0,.5); }
  .title { font-size: clamp(40px, 9vw, 84px); font-weight: 900; color: var(--ink); letter-spacing: 4px; text-shadow: 4px 4px 0 #000, -2px -2px 0 #5a3a10;
    font-family: Impact, 'Arial Black', sans-serif; text-align: center; }
  .title.sm { font-size: clamp(26px, 5vw, 40px); }
  .sub { color: #ff0; font-size: 15px; text-shadow: 1px 1px 0 #000; text-align: center; }
  .col { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 6px; }
  button, a.small { font: bold 18px monospace; padding: 11px 30px; background: #5a4a2a; color: #ff0; border: 3px solid #2e2412; cursor: pointer; box-shadow: 3px 3px 0 #000; text-decoration: none; min-width: 220px; }
  button:hover, a.small:hover { background: #6d5a33; }
  button.small, a.small { font-size: 14px; padding: 8px 18px; background: #3a3020; min-width: 160px; }
  a.back { color: #9cf; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
  .lab { color: var(--ink); font-weight: bold; min-width: 90px; text-align: left; }
  .lab2 { color: var(--ink); font-weight: bold; text-align: left; margin-top: 4px; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; justify-content: flex-end; }
  .seg.wrap { justify-content: flex-start; }
  .seg button { min-width: 0; font-size: 13px; padding: 7px 10px; box-shadow: 2px 2px 0 #000; background: #3a3020; color: #d8c890; }
  .seg button.sel { background: #8a6a2a; color: #fff; border-color: #ff981f; }
  .desc { color: #ccc; font-size: 13px; text-align: right; min-height: 1em; }
  .classes { display: flex; flex-direction: column; gap: 6px; max-height: 62vh; overflow-y: auto; }
  button.cls { display: grid; grid-template-columns: 110px 1fr; gap: 2px 10px; text-align: left; min-width: 0; padding: 8px 10px; font-size: 13px; background: #3a3020; color: #d8c890; }
  button.cls.sel { background: #8a6a2a; color: #fff; border-color: #ff981f; }
  button.cls b { grid-row: span 2; font-size: 17px; color: #ff981f; align-self: center; } button.cls.sel b { color: #ff0; }
  button.cls em { font-size: 12px; color: #ccc; } button.cls .bars { grid-column: 1 / -1; }
  @media (max-width: 520px) { button.cls { grid-template-columns: 1fr; } button.cls b { grid-row: auto; } }
  .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
  .bar { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #ccc; }
  .bar span { width: 70px; text-align: left; } .bar i { display: block; height: 7px; background: linear-gradient(90deg, #ff981f, #ffd060); border: 1px solid #000; }
  .keys { color: #ddd; font-size: 13px; line-height: 1.7; text-align: left; } .keys b { color: #ff0; }
  .row input[type=range] { flex: 1; accent-color: #ff981f; } .val { width: 40px; color: #fff; }
  .row.name input { font: 16px monospace; padding: 6px 10px; background: #1a1408; color: #ff0; border: 2px solid #5a4a2a; flex: 1; max-width: 220px; }
  #pause, #endbox { display: none; }
  #endbox .stats { color: #fff; font-size: 15px; }
  body.playing #menu { display: none; }
  @media (max-height: 520px) { .panel { padding: 8px; gap: 8px; } .box { padding: 12px 16px; gap: 8px; } .title { font-size: 36px; } button { padding: 8px 18px; font-size: 15px; } }
</style>

  { "imports": { "three": "./vendor/three.module.js", "three-mesh-bvh": "./vendor/three-mesh-bvh.module.js" } }

<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div class="panel" id="loading"><div class="title">CODSCAPE</div><div class="sub" id="status">loading...</div></div>
<div class="panel" id="menu" style="display:none"><div class="box" id="menubox"></div></div>
<div class="panel" id="pause"><div class="box"><div class="title sm">PAUSED</div><div class="col">
  <button id="p-resume">RESUME</button><button id="p-class">CHANGE CLASS</button><button id="p-settings" class="small">SETTINGS</button><button id="p-quit" class="small">QUIT MATCH</button>
</div></div></div>
<input id="chatin" maxlength="100" autocomplete="off" placeholder="say something (ENTER sends, ESC cancels)" style="display:none;position:fixed;left:10px;bottom:16%;width:min(360px,80vw);z-index:6;font:14px monospace;padding:6px 8px;background:rgba(20,15,8,.85);color:#ff0;border:2px solid #5a4a2a;outline:none">
<div class="panel" id="endbox"><div class="box"><div class="title sm">MATCH OVER</div><div class="stats"></div><div class="col">
  <button id="e-again">PLAY AGAIN</button><button id="e-menu" class="small">MAIN MENU</button>
</div></div></div>
<script type="module" src="./src/cod/main.js"></script>
</body>
