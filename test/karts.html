<!doctype html>
<html><head><meta charset="utf-8"><title>CartScape karts</title><base href="../">
<style>html,body{margin:0;background:#7fa6dc;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script></head>
<body><script type="module">
// every body in every god trim, drivers sat in: ?body=kart|mine|dragon&spin=1; ?one=i&close=1&steer=0.6 (red dots: where the hands should grip)
import * as THREE from 'three';
import { buildKart, buildDriver, gripAt, THEMES, BODIES } from './src/cart/models.js';
const q = new URLSearchParams(location.search), r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x7fa6dc);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x4a4030, 1.3)); const sun = new THREE.DirectionalLight(0xfff0d8, 1.6); sun.position.set(-3, 8, 5); scene.add(sun);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200);
const bodies = q.get('body') ? [q.get('body')] : Object.keys(BODIES), themes = Object.keys(THEMES), all = [];
let row = 0;
for (const b of bodies) { let col = 0; for (const t of themes) {
  const k = buildKart(b, t); k.group.position.set(col * 3.4 - (themes.length - 1) * 1.7, 0, row * 3.6); k.group.rotation.y = -0.6; scene.add(k.group); all.push(k);
  const st = +(q.get('steer') || 0); k.steer.rotation.x = -st * 1.2;
  buildDriver(Object.fromEntries([[0, THEMES[t].outfit[0]], [4, THEMES[t].outfit[1]], [7, THEMES[t].outfit[2]]]), k).then(d => { k.body.add(d.group); d.steer(st); (window.reach ||= []).push([b, t, d.p.reach]);
    if (q.get('close')) for (const sd of [-1, 1]) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.025), new THREE.MeshBasicMaterial({ color: 0xff0000, depthTest: false })); m.position.fromArray(gripAt(k, sd, st)); m.renderOrder = 9; k.body.add(m); } });
  col++; } row++; }
const g = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshLambertMaterial({ color: 0x5a8a3a })); g.rotation.x = -Math.PI / 2; g.position.z = row * 1.8 - 1.8; scene.add(g);
cam.position.set(0, 9 + row * 3, row * 3.6 + 10); cam.lookAt(0, 0, row * 1.8 - 1.8);
if (q.get('one')) { cam.fov = q.get('close') ? 12 : 20; cam.position.set(...(q.get('close') ? [2.2, 2.4, 3.2] : [4, 3, 7])); cam.lookAt(...(q.get('close') ? [0.1, 0.85, 0] : [0, 0.6, 0])); cam.updateProjectionMatrix(); for (const k of all) k.group.visible = false; all[+q.get('one')].group.visible = true; all[+q.get('one')].group.position.set(0, 0, 0); }
(function loop() { requestAnimationFrame(loop); if (q.get('spin')) for (const k of all) k.group.rotation.y += 0.01; r.render(scene, cam); })();
window.ready = true;
</script></body></html>
